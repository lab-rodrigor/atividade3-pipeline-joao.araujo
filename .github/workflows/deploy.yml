name: deploy

# O pipeline faz o que você fez à mão na atividade 2. A cada push na main, ele
# derruba a topologia e sobe de novo.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SLUG: joao-araujo
  PORTA: 23150

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Preparar a chave de deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H gr.lab.ayty.org >> ~/.ssh/known_hosts

      - name: Derrubar a topologia antiga
        run: |
          ssh -i ~/.ssh/deploy gr-${SLUG}@gr.lab.ayty.org gr-docker stop front || true
          ssh -i ~/.ssh/deploy gr-${SLUG}@gr.lab.ayty.org gr-docker rm front || true

          ssh -i ~/.ssh/deploy gr-${SLUG}@gr.lab.ayty.org gr-docker stop api || true
          ssh -i ~/.ssh/deploy gr-${SLUG}@gr.lab.ayty.org gr-docker rm api || true

          ssh -i ~/.ssh/deploy gr-${SLUG}@gr.lab.ayty.org gr-docker stop banco || true
          ssh -i ~/.ssh/deploy gr-${SLUG}@gr.lab.ayty.org gr-docker rm banco || true

      - name: Criar rede e volume
        run: |
          ssh -i ~/.ssh/deploy gr-${SLUG}@gr.lab.ayty.org gr-docker network create web || true
          ssh -i ~/.ssh/deploy gr-${SLUG}@gr.lab.ayty.org gr-docker network create dados --interna || true
          ssh -i ~/.ssh/deploy gr-${SLUG}@gr.lab.ayty.org gr-docker volume create pgdata || true

      - name: Subir banco, API e front
        run: |
          ssh -i ~/.ssh/deploy gr-${SLUG}@gr.lab.ayty.org gr-docker run postgres:17-alpine \
            --name banco \
            --network dados \
            -v pgdata:/var/lib/postgresql/data \
            -e POSTGRES_USER=app \
            -e POSTGRES_PASSWORD=${{ secrets.DB_SENHA }} \
            -e POSTGRES_DB=appdb

          ssh -i ~/.ssh/deploy gr-${SLUG}@gr.lab.ayty.org gr-docker run gr-atv2-api:1 \
            --name api \
            --network web \
            -e POSTGRES_HOST=gr-${SLUG}-banco \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_DB=appdb \
            -e POSTGRES_USER=app \
            -e POSTGRES_PASSWORD=${{ secrets.DB_SENHA }}

          ssh -i ~/.ssh/deploy gr-${SLUG}@gr.lab.ayty.org gr-docker network connect dados api

          ssh -i ~/.ssh/deploy gr-${SLUG}@gr.lab.ayty.org gr-docker run gr-atv2-front:1 \
            --name front \
            --network web \
            -p ${PORTA}:80 \
            -e API=gr-${SLUG}-api \
            -e DEPLOY_SHA=${{ github.sha }}

      - name: Conferir que subiu
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent "http://gr.lab.ayty.org:${PORTA}/api/pokemons"; then
              echo
              echo "Aplicação respondeu corretamente."
              exit 0
            fi

            echo "Tentativa ${i}/30: aguardando aplicação subir..."
            sleep 2
          done

          echo "A aplicação não respondeu a tempo."
          exit 1